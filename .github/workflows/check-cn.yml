name: Check CN domains from GitHub runner

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: curl CN domains
        run: |
          for h in https://x-route.cn https://www.x-route.cn https://x-route.app; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$h" || echo FAIL)
            echo "$h -> $code"
          done
          echo "--- DNS ---"
          for h in x-route.cn www.x-route.cn; do
            echo "$h A: $(dig +short $h @1.1.1.1 | tr '\n' ' ')"
          done
