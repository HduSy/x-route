name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger from the Actions tab

concurrency:
  group: deploy-main
  cancel-in-progress: true # Only the latest push to main deploys

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # Reads packageManager (pnpm@10.23.0) from root package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @x-route/web build

      # Workers deploy: x-route.app + www + /api/graphhopper relay (main site)
      # Note: dist/_redirects (Pages-only directive) is removed before packaging —
      # Workers Assets would honor it and 301-loop every static file.
      - name: Remove Pages-only _redirects
        run: rm -f apps/web/dist/_redirects

      - name: Deploy Worker (x-route.app)
        working-directory: apps/web
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Legacy x-route.pages.dev → x-route.app 301 is frozen on the Pages
      # project's last deployment (Pages keeps serving it); no further
      # Pages deploys are needed since the Workers migration.
